function combinedEveningRows(st,filter="all"){
  // Flexible combined attendance:
  // Build combinations ONLY from classes that were actually saved, not from the weekly timetable.
  // Any subject can qualify: if the same subject has a held class before lunch and another
  // held class evening, it gets a combined card. The subject name itself does not matter.
  const groups=new Map();
  const records=state.records||{};
  Object.entries(records).forEach(([recordKey,rec])=>{
    const dk=String(recordKey).slice(0,10);
    if(filter!=="all" && dk.slice(0,7)!==filter)return;
    const status=state.status[recordKey];
    // A combination represents classes that actually happened. Ignore pending and Not Held.
    if(status!==STATUS.ATTENDED && status!==STATUS.ABSENT && status!==STATUS.LEAVE)return;
    const subject=String(normalizeSubjectText(rec&&rec.subject||"")).trim();
    const start=String(rec&&rec.start||"");
    if(!subject || /\(Clinical\)$/.test(subject))return;
    const base=subjectBase(subject);
    if(!base)return;
    const period=start>="15:00"?"after":"before";
    let g=groups.get(base);
    if(!g){
      g={before:{attended:0,absent:0,leave:0},after:{attended:0,absent:0,leave:0}};
      groups.set(base,g);
    }
    const bucket=g[period];
    if(status===STATUS.ATTENDED)bucket.attended++;
    else if(status===STATUS.ABSENT)bucket.absent++;
    else if(status===STATUS.LEAVE)bucket.leave++;
  });

  return [...groups.entries()]
    .filter(([,g])=>{
      const beforeHeld=g.before.attended+g.before.absent+g.before.leave;
      const afterHeld=g.after.attended+g.after.absent+g.after.leave;
      return beforeHeld>0 && afterHeld>0;
    })
    .sort(([a],[b])=>a.localeCompare(b))
    .map(([base,g])=>{
      const attended=g.before.attended+g.after.attended;
      const absent=g.before.absent+g.after.absent;
      const leave=g.before.leave+g.after.leave;
      const held=attended+absent+leave;
      return {
        subject:base+" — Morning + Evening",
        attended,absent,leave,held,
        pct:held?attended/held*100:null,
        combined:true
      };
    });
}

function statsTab(){let filter=state.statsFilter,st=compute(filter),pct=st.percent===null?0:Math.min(100,st.percent),months=[];let c=new Date(START_DATE.getFullYear(),START_DATE.getMonth(),1),e=new Date(today().getFullYear(),today().getMonth(),1);while(c<=e){months.push(key(c).slice(0,7));c=new Date(c.getFullYear(),c.getMonth()+1,1)}let h=`<div class="tabs"><button class="filter ${filter==="all"?"active":""}" data-act="filter" data-v="all">Overall</button>${months.slice().reverse().map(m=>`<button class="filter ${filter===m?"active":""}" data-act="filter" data-v="${m}">${parseKey(m+"-01").toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}</button>`).join("")}</div><div class="card statsHero"><div class="ring" style="--p:${pct}%"><div class="ringIn">${st.percent===null?"—":st.percent.toFixed(1)+"%"}</div></div><b>Overall attendance</b><div class="small">${st.attended} present of ${st.held} held classes</div></div><div class="grid4"><div class="card metric"><b>${st.attended}</b><span>Present</span></div><div class="card metric"><b>${st.absent}</b><span>Absent</span></div><div class="card metric"><b>${st.pending}</b><span>Pending</span></div></div><div class="sectionTitle">📚 Subject attendance</div>`;
// Individual subjects only — combined rows are deliberately kept out of this section.
st.rows.forEach(r=>h+=statsCard(r));
// Flexible combinations from actually saved classes get their own separate section.
let combined=combinedEveningRows(st,filter);
if(combined.length){h+=`<div class="sectionTitle">🔗 Combined Morning & Evening Attendance</div><div class="small" style="margin:-4px 0 10px">Shown automatically when the same subject has actually been held both before and evening.</div>`;combined.forEach(r=>h+=statsCard(r," 🔗"))}
return h}
function calendarTab(){let m=parseKey(state.calendarMonth),y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),start=first.getDay(),days=new Date(y,mo+1,0).getDate();let h=`<div class="card calendar"><div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn outline" data-act="calPrev">‹</button><b>${monthFmt(first)}</b><button class="btn outline" data-act="calNext">›</button></div><div class="calGrid">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="calDow">${x}</div>`).join("")}${Array.from({length:start},()=>`<div class="calDay empty"></div>`).join("")}`;for(let n=1;n<=days;n++){let d=new Date(y,mo,n),dk=key(d),ss=sessionsFor(d),dot="";if(state.holidays[dk])dot="holiday";else if(ss.length){let vals=ss.map((_,i)=>statusOf(dk,i));if(vals.some(v=>v===STATUS.ABSENT||v===STATUS.LEAVE))dot=vals.some(v=>v===STATUS.ATTENDED)?"mix":"bad";else if(vals.some(v=>v===STATUS.ATTENDED))dot="good"}h+=`<button class="calDay ${dk===key(today())?"today":""}" data-act="calPick" data-v="${dk}">${n}${dot?`<i class="dot ${dot}"></i>`:""}</button>`}h+=`</div></div><div class="banner info">🟢 Present · 🔴 Absent · 🟡 Mixed · 🟣 Holiday. Tap a date to open its log.</div>`;return h}
function settingsTab(){let s=state.settings;return `<div class="card formCard"><b>⚙️ Settings</b><label class="label">Name</label><input id="setName" class="input" value="${esc(s.name||"")}" placeholder="Enter your name"><label class="label">Course / Academic part</label><input id="setCourse" class="input" value="${esc(s.course)}"><label class="label">Minimum required attendance (%)</label><input id="setRequired" class="input" type="number" min="1" max="100" value="${s.required}"><p class="small" style="margin-top:12px">🔒 Attendance logging time is fixed at 6:00 AM and cannot be changed.</p><label class="label">Clinical Posting Roll Number</label>${s.rollLocked&&s.rollNumber?`<div class="input" style="display:flex;align-items:center;justify-content:space-between"><b>${esc(s.rollNumber)}</b><span>🔒 Permanently locked</span></div><p class="small">Your roll number is permanently saved and cannot be changed.</p>`:`<input id="setRoll" class="input" type="number" min="1" max="100" value="${esc(s.rollNumber||"")}" placeholder="Enter your roll number (1–100)"><p class="small">⚠️ Check carefully. Once saved, your roll number will be permanently locked.</p>`}<p class="small">The app automatically switches to the new roll-number group arrangement from 9 Aug 2027.</p><label class="label">Appearance</label><select id="setTheme" class="input"><option value="system" ${s.theme==="system"?"selected":""}>System default</option><option value="light" ${s.theme==="light"?"selected":""}>Light</option><option value="dark" ${s.theme==="dark"?"selected":""}>Dark</option></select><div style="margin-top:14px"><button class="btn" data-act="saveSettings">Save settings</button></div></div><div class="card formCard"><b>📚 Schedule</b><p class="small">Schedule changes apply to new/unsaved classes. Saved attendance keeps its original subject permanently for accurate history and statistics.</p><button class="btn outline" type="button" onclick="openManageSchedule()">Manage schedule</button></div><p class="small" style="text-align:center">Tracking starts on 7 Sep 2026 and continues indefinitely.</p>`}
function scheduleModal(){let s=state.settings.schedule;let body=`<div class="modal" data-act="closeModal"><div class="modalBox" onclick="event.stopPropagation()"><div class="row" style="justify-content:space-between"><b>Manage weekly schedule</b><button class="btn outline" data-act="closeModal">Close</button></div><p class="small">Edit times and subjects. Changes affect new/unsaved classes only; already saved attendance keeps its original class snapshot.</p>`;for(let day=1;day<=6;day++){body+=`<div class="formCard card"><b>${DAYS[day]}</b><div id="sch${day}">${(s[day]||[]).map((x,i)=>scheduleRow(day,i,x)).join("")}</div><button class="btn soft" data-act="addSession" data-day="${day}">+ Add class</button></div>`}body+=`<div class="row"><button class="btn grow" data-act="saveSchedule">Save schedule</button><button class="btn outline" data-act="closeModal">Cancel</button></div></div></div>`;document.body.insertAdjacentHTML("beforeend",body)}
function scheduleSubjectSelect(selected){let known=SUBJECT_LIST.includes(selected);let opts=SUBJECT_LIST.map(v=>`<option value="${esc(v)}" ${v===selected?"selected":""}>${esc(v)}</option>`).join("");return `<div class="grow schSubjectWrap"><select class="input schSubject">${known?"":`<option value="__OTHER__" selected>Other (custom)</option>`}${opts}<option value="__OTHER__" ${known?"":"selected"}>Other (type manually)</option></select><input class="input schOther ${known?"hidden":""}" style="margin-top:6px" value="${known?"":esc(selected)}" placeholder="Type subject carefully"></div>`}
function scheduleRow(day,i,x){return `<div class="row schRow" style="margin:8px 0"><input class="input schStart" style="width:82px" type="time" value="${x[0]}"><input class="input schEnd" style="width:82px" type="time" value="${x[1]}">${scheduleSubjectSelect(x[2])}<button class="btn outline" data-act="removeSession" data-day="${day}">×</button></div>`}

// Extra class dialog. The previous build had click handlers for Add extra class,
// but the dialog function itself was missing, so the button could not work.

  if(!editable(state.viewDate)){toast("This date is locked");return}

    <div class="row" style="justify-content:space-between"><b>Add extra class</b><button class="btn outline" data-act="closeModal">Close</button></div>

// Keep scheduled-class editing functional as well.
function classModal(i){
  if(!editable(state.viewDate)){toast("This date is locked");return}

  document.body.appendChild(modal);
  toggleOtherSubject();

function footer(){return `<div class="madeby">Made By Sharad Sourav</div>`}
function bottom(){let items=[["log","▣","Log"],["stats","▥","Stats"],["settings","⚙","Settings"]];return `<div class="nav">${items.map(x=>`<button class="${state.tab===x[0]?"active":""}" data-act="tab" data-v="${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join("")}</div>`}
function render(){applyTheme();let content=state.tab==="log"?logTab():state.tab==="stats"?statsTab():state.tab==="calendar"?calendarTab():settingsTab();document.getElementById("app").innerHTML=`<div class="app">${header()}<main class="container">${content}${footer()}</main>${bottom()}</div>`}
function toast(msg){let old=document.querySelector(".toast");if(old)old.remove();let x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function datePicker(){
  // Use a visible date control inside a modal. Some Android WebViews (including
  // certain AppGeyser builds) do not open a programmatically-clicked hidden date input.
  const modal=document.createElement("div");
  modal.className="modal";
  modal.innerHTML=`<div class="modalBox" role="dialog" aria-modal="true">
    <h2 style="margin:0 0 14px;font-size:19px">Choose date</h2>
    <label class="label" for="pickerDate">Attendance date</label>
    <input id="pickerDate" class="input" type="date" min="${key(START_DATE)}" value="${state.viewDate}">
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      <button class="btn outline" data-act="closeModal">Cancel</button>
      <button class="btn" data-act="confirmDate">Open date</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}
document.addEventListener("click",e=>{let el=e.target.closest("[data-act]");if(!el)return;let a=el.dataset.act;if(a==="tab"){draftDate=null;draftStatus={};state.tab=el.dataset.v;save();render()}else if(a==="prev"){draftDate=null;draftStatus={};let d=add(parseKey(state.viewDate),-1);state.viewDate=key(d<START_DATE?START_DATE:d);save();render()}else if(a==="next"){draftDate=null;draftStatus={};state.viewDate=key(add(parseKey(state.viewDate),1));save();render()}else if(a==="today"){draftDate=null;draftStatus={};state.viewDate=key(today());save();render()}else if(a==="pickDate"||a==="dateInput")datePicker();else if(a==="confirmDate"){let inp=document.getElementById("pickerDate");if(inp&&inp.value){draftDate=null;draftStatus={};state.viewDate=inp.value;state.tab="log";save();document.querySelectorAll(".modal").forEach(m=>m.remove());render()}}else if(a==="status")setStatus(el.dataset.k,el.dataset.v);else if(a==="clinicalRollAlert")clinicalRollAlert();else if(a==="closeRollPopup"){document.querySelectorAll(".rollPopup").forEach(x=>x.remove())}else if(a==="confirmCustomConfirm"){runCustomConfirm()}else if(a==="cancelCustomConfirm"){closeCustomConfirm()}else if(a==="saveAttendance")saveAttendance(state.viewDate);else if(a==="holiday")toggleHoliday(state.viewDate);else if(a==="saveNote")setNote(state.viewDate,document.getElementById("dayNote").value);else if(a==="editClass")classModal(Number(el.dataset.i));else if(a==="addExtra")extraModal();else if(a==="saveClassEdit"){let i=Number(el.dataset.i),dk=state.viewDate,base=(state.settings.schedule[parseKey(dk).getDay()]||[]).length,sub=selectedSubject(),st=document.getElementById("actualStart").value,en=document.getElementById("actualEnd").value;if(!sub||!st||!en){toast("Enter subject and times");return}if(i<base){state.overrides[dk]=state.overrides[dk]||{};state.overrides[dk][i]={subject:sub,start:st,end:en}}else{let j=i-base;state.extraClasses[dk][j]=[st,en,sub]}save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Actual class saved")}else if(a==="restoreClass"){let dk=state.viewDate,i=Number(el.dataset.i);if(state.overrides[dk])delete state.overrides[dk][i];save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Scheduled class restored")}else if(a==="saveExtra"){let dk=state.viewDate,sub=selectedSubject(),st=document.getElementById("extraStart").value,en=document.getElementById("extraEnd").value;if(!sub||!st||!en){toast("Enter subject and times");return}state.extraClasses[dk]=state.extraClasses[dk]||[];state.extraClasses[dk].push([st,en,sub]);save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Extra class added")}else if(a==="removeExtra"){let dk=state.viewDate,i=Number(el.dataset.i),base=(state.settings.schedule[parseKey(dk).getDay()]||[]).length,j=i-base;if(!editable(dk)||j<0||!state.extraClasses[dk]||!state.extraClasses[dk][j]){toast("This extra class cannot be removed");return}// Extra classes may be removed even after their attendance was saved for an editable date.
// Remove that extra class and its own saved attendance, then keep later class data aligned.
delete state.status[sessionKey(dk,i)];
delete state.records[sessionKey(dk,i)];
if(Object.prototype.hasOwnProperty.call(draftStatus,sessionKey(dk,i)))delete draftStatus[sessionKey(dk,i)];
state.extraClasses[dk].splice(j,1);if(!state.extraClasses[dk].length)delete state.extraClasses[dk];let shiftStore=(obj)=>{if(!obj)return;let moved={};Object.keys(obj).forEach(k=>{if(!k.startsWith(dk+"-"))return;let n=Number(k.slice(dk.length+1));if(n>i){moved[sessionKey(dk,n-1)]=obj[k];delete obj[k]}});Object.assign(obj,moved)};shiftStore(state.status);shiftStore(state.records);shiftStore(draftStatus);save();render();toast("Extra class removed");}else if(a==="filter"){state.statsFilter=el.dataset.v;render()}else if(a==="calPrev"){let d=parseKey(state.calendarMonth);state.calendarMonth=key(new Date(d.getFullYear(),d.getMonth()-1,1));save();render()}else if(a==="calNext"){let d=parseKey(state.calendarMonth);state.calendarMonth=key(new Date(d.getFullYear(),d.getMonth()+1,1));save();render()}else if(a==="calPick"){draftDate=null;draftStatus={};state.viewDate=el.dataset.v;state.tab="log";save();render()}else if(a==="saveSettings"){state.settings.name=document.getElementById("setName").value.trim()||"Student";state.settings.course=document.getElementById("setCourse").value.trim()||"Course";state.settings.required=Math.max(1,Math.min(100,Number(document.getElementById("setRequired").value)||75));state.settings.unlockHour=6;let rollInput=document.getElementById("setRoll");if(rollInput&&!state.settings.rollLocked){let rn=rollInput.value.trim();if(rn!==""){if(!/^(?:[1-9]|[1-9][0-9]|100)$/.test(rn)){toast("Enter a valid roll number (1–100)");return}customConfirm("Confirm roll number","Confirm roll number "+rn+"? Once saved, it cannot be changed.",()=>{state.settings.rollNumber=rn;state.settings.rollLocked=true;state.settings.theme=document.getElementById("setTheme")?document.getElementById("setTheme").value:state.settings.theme;save();applyTheme();render();toast("Settings saved")});return}else{state.settings.rollNumber="";state.settings.rollLocked=false}}state.settings.theme=document.getElementById("setTheme").value;save();applyTheme();render();toast("Settings saved")}else if(a==="schedule")scheduleModal();else if(a==="closeModal"){document.querySelectorAll(".modal").forEach(m=>m.remove())}else if(a==="addSession"){let box=document.getElementById("sch"+el.dataset.day),i=box.children.length;box.insertAdjacentHTML("beforeend",scheduleRow(el.dataset.day,i,["09:00","10:00","New Subject"]))}else if(a==="removeSession"){el.parentElement.remove()}else if(a==="saveSchedule"){let ns={};for(let day=1;day<=6;day++){ns[day]=[...document.querySelectorAll("#sch"+day+" > .schRow")].map(r=>{let sub=r.querySelector(".schSubject").value;if(sub==="__OTHER__")sub=r.querySelector(".schOther").value.trim();return [r.querySelector(".schStart").value,r.querySelector(".schEnd").value,sub]}).filter(x=>x[0]&&x[1]&&x[2])}state.settings.schedule=ns;save();document.querySelectorAll(".modal").forEach(m=>m.remove());render();toast("Schedule saved and will be used for future unsaved classes")}});

function checkDay(){let cur=key(today());if(state.viewDate<key(START_DATE))state.viewDate=key(START_DATE);render()}document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkDay()});window.addEventListener("focus",checkDay);setInterval(checkDay,60000);load();applyTheme();watchSystemTheme();render();if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

// Robust Manage Schedule controls (direct handlers; independent of delegated clicks)
function openManageSchedule(){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  const s=state.settings.schedule||{};
  let html='<div class="modal" id="manageScheduleModal"><div class="modalBox">'
    +'<div class="row" style="justify-content:space-between"><b>Manage weekly schedule</b><button type="button" class="btn outline" onclick="closeManageSchedule()">Close</button></div>'
    +'<p class="small">Edit your timetable. Saved attendance is never changed. The updated schedule is used for future and unsaved classes.</p>';
  for(let day=1;day<=6;day++){
    html+='<div class="formCard card"><b>'+DAYS[day]+'</b><div id="freshSch'+day+'">';
    (s[day]||[]).forEach((x,i)=>html+=freshScheduleRow(day,i,x));
    html+='</div><button type="button" class="btn soft" onclick="addFreshScheduleRow('+day+')">+ Add class</button></div>';
  }
  html+='<div class="row"><button type="button" class="btn grow" onclick="saveManageSchedule()">Save schedule</button><button type="button" class="btn outline" onclick="closeManageSchedule()">Cancel</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}
function freshScheduleRow(day,i,x){
  const opts=SUBJECT_LIST.map(v=>'<option value="'+esc(v)+'" '+(v===x[2]?'selected':'')+'>'+esc(v)+'</option>').join('')+'<option value="__OTHER__" '+(!SUBJECT_LIST.includes(x[2])?'selected':'')+'>Other (type manually)</option>';
  const other=SUBJECT_LIST.includes(x[2])?'':'<input class="input freshOther" value="'+esc(x[2])+'" placeholder="Other subject">';
  return '<div class="freshSchRow" style="margin:8px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap">'
    +'<input class="input freshStart" style="width:110px" type="time" value="'+esc(x[0])+'">'
    +'<input class="input freshEnd" style="width:110px" type="time" value="'+esc(x[1])+'">'
    +'<select class="input freshSubject" style="flex:1;min-width:180px" onchange="freshOtherToggle(this)">'+opts+'</select>'+other
    +'<button type="button" class="btn outline" onclick="this.closest(&quot;.freshSchRow&quot;).remove()">×</button></div>';
}
function freshOtherToggle(sel){
  const row=sel.closest('.freshSchRow'); let old=row.querySelector('.freshOther');
  if(sel.value==='__OTHER__'&&!old){sel.insertAdjacentHTML('afterend','<input class="input freshOther" placeholder="Other subject">');}
  if(sel.value!=='__OTHER__'&&old)old.remove();
}
function addFreshScheduleRow(day){document.getElementById('freshSch'+day).insertAdjacentHTML('beforeend',freshScheduleRow(day,0,['09:00','10:00',SUBJECT_LIST[0]]));}
function closeManageSchedule(){const m=document.getElementById('manageScheduleModal');if(m)m.remove();}
function saveManageSchedule(){
  const ns={};
  for(let day=1;day<=6;day++){
    ns[day]=[...document.querySelectorAll('#freshSch'+day+' .freshSchRow')].map(r=>{
      const subSel=r.querySelector('.freshSubject');
      const sub=subSel.value==='__OTHER__'?(r.querySelector('.freshOther')?.value.trim()||''):subSel.value;
      return [r.querySelector('.freshStart').value,r.querySelector('.freshEnd').value,sub];
    }).filter(x=>x[0]&&x[1]&&x[2]);
  }
  state.settings.schedule=ns;
  save(); closeManageSchedule(); render(); toast('Schedule saved successfully');
}
window.openManageSchedule=openManageSchedule;window.closeManageSchedule=closeManageSchedule;window.saveManageSchedule=saveManageSchedule;window.addFreshScheduleRow=addFreshScheduleRow;window.freshOtherToggle=freshOtherToggle;

</script></body></html>
